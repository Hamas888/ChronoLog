; =============================================================================
; ChronoLog — PlatformIO Examples
; =============================================================================
; One project, 8 environments: 4 Arduino + 4 ESP-IDF.
;
; Build a single example:
;   pio run -e arduino-logging
;
; Build all 8 examples:
;   pio run
;
; ChronoLog is pulled from the PlatformIO registry.  To build against an
; unreleased branch instead, clone ChronoLog to  lib/ChronoLog/  and
; PlatformIO will auto-discover the local copy.
; =============================================================================

[platformio]
description = ChronoLog cross-platform logging library — embedded examples

; ─────────────────────────────────────────────────────────────────────────────
; Common settings shared by all environments
; ─────────────────────────────────────────────────────────────────────────────
[common]
platform = espressif32
board = esp32-s3-devkitm-1
; lib_deps = ChronoLog
lib_deps = https://github.com/Hamas888/ChronoLog.git
build_flags =
    -DCHRONOLOG_PRO_FEATURES=1
    -DCHRONOLOG_REMOTE_ENABLE=1
    -DCHRONOLOG_THREAD_SAFE=1
    -DCHRONOLOG_COLOR_ENABLE=1

; ─────────────────────────────────────────────────────────────────────────────
; Arduino Framework (setup / loop)
; ─────────────────────────────────────────────────────────────────────────────
[env:arduino-logging]
extends = common
framework = arduino
src_filter = -<*> +<arduino_Logging.cpp>

[env:arduino-progressbar]
extends = common
framework = arduino
src_filter = -<*> +<arduino_ProgressBar.cpp>

[env:arduino-remotelogging]
extends = common
framework = arduino
src_filter = -<*> +<arduino_RemoteLogging.cpp>

[env:arduino-threadsafety]
extends = common
framework = arduino
src_filter = -<*> +<arduino_ThreadSafety.cpp>

[env:arduino-filesink]
extends = common
framework = arduino
src_filter = -<*> +<arduino_FileSink.cpp>
build_flags =
    ${common.build_flags}
    -DCHRONOLOG_SINKS_ENABLE=1
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv

; ─────────────────────────────────────────────────────────────────────────────
; ESP-IDF Framework (app_main)
; ─────────────────────────────────────────────────────────────────────────────
[env:espidf-logging]
extends = common
framework = espidf
src_filter = -<*> +<espidf_Logging.cpp>

[env:espidf-progressbar]
extends = common
framework = espidf
src_filter = -<*> +<espidf_ProgressBar.cpp>

[env:espidf-remotelogging]
extends = common
framework = espidf
src_filter = -<*> +<espidf_RemoteLogging.cpp>

[env:espidf-threadsafety]
extends = common
framework = espidf
src_filter = -<*> +<espidf_ThreadSafety.cpp>
