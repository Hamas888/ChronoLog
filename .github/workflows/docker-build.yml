# =============================================================================
# Build & publish ChronoLog CI Docker image to GitHub Container Registry
# =============================================================================
# Runs on:
#   - Push to main (when Dockerfile or this workflow changes)
#   - Manual dispatch (to rebuild on demand)
#   - PRs targeting main (dry-run, no push)
# =============================================================================

name: Build CI Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker-build.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker-build.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Docker/GHCR requires all-lowercase — cannot use ${{ github.repository }}
  IMAGE_NAME: hamas888/chronolog-ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
