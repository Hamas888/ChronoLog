name: "chronoLog"
version: "1.1.5"

description: >
  Cross-platform chrono-based logging library for embedded systems.
  Provides thread-safe, timestamped logs with module tagging and RTOS awareness.
  Works on ESP-IDF, STM32 HAL, Arduino, and Linux/Windows.

url: "https://github.com/Hamas888/ChronoLog"
repository: "https://github.com/Hamas888/ChronoLog.git"
issues: "https://github.com/Hamas888/ChronoLog/issues"

maintainers:
  - "Hamas Saeed <hamasaeed888@gmail.com>"

license: "MIT"

dependencies:
  idf: ">=5.0"

examples:
  - path: examples/ESP32/ESP-IDF/Logging
  - path: examples/ESP32/ESP-IDF/ProgressBar
  - path: examples/ESP32/ESP-IDF/RemoteLogging
  - path: examples/ESP32/ESP-IDF/ThreadSafety

tags:
  - logger
  - chrono
  - thread-safe
  - embedded
  - esp-idf
  - rtos
  - debug
  - uart
  - cross-platform
  - logging
  - serial
  - printf
  - profiling
  - progress-bar
  - Remote Logging